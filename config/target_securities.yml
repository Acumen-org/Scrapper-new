# CUSIPs are OBSERVED, not recalled: each was read from a real filed information
# table alongside the issuer name shown. An unverified ticker carries a null
# cusip and is excluded from scoring rather than guessed at.
#
# CUSIPs are QUOTED. An all-digit CUSIP (756109104) is otherwise parsed as an
# integer while parsed holdings are strings, so the lookup silently never
# matches and the ticker reports zero holders. That is indistinguishable from
# nobody holding it. Realty Income and NNN REIT were both lost this way.
#
# Verified entries are IMMUTABLE: a later run may add evidence but may not
# downgrade or replace a verified cusip without --allow-downgrade.

