  - id: mid_atlantic
    canonical: "Mid Atlantic Trust"
    prefixes: ["MID ATLANTIC"]

  - id: hilltop
    canonical: "Hilltop Securities"
    prefixes: ["HILLTOP", "SOUTHWEST SECURITIES"]

  - id: jefferies
    canonical: "Jefferies"
    prefixes: ["JEFFERIES"]

  - id: cibc_mellon
    canonical: "CIBC Mellon"
    # Joint venture, distinct from BNY Mellon. Listed before bny_mellon would
    # match nothing anyway, since neither prefix is a prefix of the other.
    prefixes: ["CIBC"]

  - id: reliance_trust
    canonical: "Reliance Trust"
    prefixes: ["RELIANCE TRUST"]

  - id: bank_of_america
    canonical: "Bank of America"
    # Merrill is BofA-owned but is the adviser-facing brand and keeps its own
    # entity, the same call made for Pershing and BNY.
    prefixes: ["BANK OF AMERICA"]

  - id: stonex
    canonical: "StoneX"
    prefixes: ["STONEX", "INTL FCSTONE"]

  - id: nationwide
    canonical: "Nationwide"
    prefixes: ["NATIONWIDE"]

  - id: trust_co_america
    canonical: "Trust Company of America"
    prefixes: ["TRUST COMPANY OF AMERICA"]


# Dated custodian consolidations. A firm moving between the two sides of one of
# these is re-papering nothing: it was moved by its custodian, not by choice, and
# the change carries no buying signal. Trigger computation excludes transitions
# matching a rule below, and the base rate excludes them too.
#
# This will happen again. Pershing, LPL and others consolidate books the same
# way, so new rules are added here rather than in code.
migrations:
  - id: tda_to_schwab
    label: "Schwab completes TD Ameritrade advisor custody transition"
    from: td_ameritrade
    to: schwab
    # Conversion ran in waves across 2023 and into 2024. Window is deliberately
    # generous at both ends: a false negative here costs one suppressed trigger,
    # a false positive floods the queue and teaches the team to ignore it.
    window_start: "2023-01-01"
    window_end: "2024-12-31"
