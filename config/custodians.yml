  # Added after the first normalisation pass surfaced them on the review list.
  - id: assetmark
    canonical: "AssetMark"
    prefixes: ["ASSETMARK"]

  - id: american_funds
    canonical: "American Funds"
    prefixes: ["AMERICAN FUNDS", "CAPITAL GROUP"]

  - id: trade_pmr
    canonical: "Trade-PMR"
    prefixes: ["TRADE PMR", "TRADEPMR"]

