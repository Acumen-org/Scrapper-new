# ---------------------------------------------------------------- glossary
glossary:
  - key: ria
    title: RIA
    body: Registered investment adviser. A firm paid to advise on securities, registered with the SEC (usually $100M+ in assets) or with its home state. Owes clients a fiduciary duty.
  - key: iar
    title: IAR
    body: Investment adviser representative. A person who gives advice for an RIA. Form ADV Item 5.B counts them.
  - key: era
    title: ERA
    body: Exempt reporting adviser. Advises only venture funds or under $150M of private funds, files part of Form ADV, but is not registered.
  - key: raum
    title: AUM and RAUM
    body: Assets under management. Regulatory AUM (RAUM, Item 5.F) counts only accounts the firm continuously supervises, gross of leverage; it is the number Bellwether shows as assets.
  - key: form_adv
    title: Form ADV
    body: The adviser's registration form. Part 1A is the data (clients, assets, services, affiliations); Part 2A is the plain-English brochure; Part 2B the advisor supplements; Part 3 the client relationship summary (Form CRS).
  - key: item_5d
    title: Item 5.D
    body: The ADV table of client types with their counts and assets (individuals, HNW, funds, pooled vehicles, pension plans, charities, institutions). Bellwether reads it to tell a wealth manager from an asset manager.
  - key: schedule_a
    title: Schedule A and B
    body: Form ADV schedules naming the firm's direct (A) and indirect (B) owners and executive officers, with ownership brackets; E means 75% or more. Bellwether's copy comes from the SEC archive to December 2024.
  - key: schedule_d
    title: Schedule D
    body: Detail behind Part 1A. 7.A lists related financial firms (broker-dealers, banks, insurers); 7.B.1 lists each private fund with its type and size; 5.K lists custodians.
  - key: item_7a
    title: Item 7.A
    body: Which kinds of related persons the adviser has (broker-dealer, bank, trust company, insurer, fund sponsor). A related insurance agency is common for planners and does not make a firm captive.
  - key: f13
    title: 13F
    body: Quarterly SEC filing of US-listed equity holdings by managers with $100M+ in such securities. Shows what an adviser actually holds.
  - key: custodian
    title: Custodian
    body: The bank or broker that holds an adviser's client assets (Schwab, Fidelity, Pershing). A qualified custodian is one the custody rule accepts.
  - key: wirehouse
    title: Wirehouse
    body: A national brokerage with employee advisors (Morgan Stanley, Merrill, UBS, Wells Fargo). Its advisors cannot buy tools or products on their own.
  - key: ibd
    title: Independent broker-dealer
    body: A broker-dealer whose reps are independent contractors (LPL, Commonwealth, Osaic). Products and tools are approved by its home office.
  - key: dual_registrant
    title: Dual registrant and hybrid RIA
    body: A dual registrant is both an adviser and a broker-dealer. A hybrid RIA is an independent adviser whose people also hold broker-dealer licenses, so it earns fees and commissions.
  - key: tamp
    title: TAMP
    body: Turnkey asset management platform. Runs portfolios, models and trading for other advisers' clients (AssetMark, Envestnet, SEI, Orion).
  - key: ocio
    title: OCIO
    body: Outsourced chief investment officer. Runs an institution's whole portfolio, usually for endowments, foundations and pension plans.
  - key: family_office
    title: Family office
    body: Manages a wealthy family's affairs. Single-family offices are exempt and do not file; multi-family offices register as RIAs.
  - key: hnw
    title: HNW and UHNW
    body: "High net worth: on Form ADV, a client with $1.1M or more with the adviser or $2.2M net worth. Ultra high net worth usually means $30M or more."
  - key: wrap
    title: Wrap fee program
    body: One fee covering advice, trading and custody. Sponsors and portfolio managers report wrap assets in Item 5.I; typical of TAMPs and brokerages.
  - key: private_fund
    title: Private fund
    body: A pooled vehicle exempt from fund registration (hedge, private equity, venture, real estate, credit). Item 7.B says whether an adviser advises any.
  - key: cco
    title: CCO
    body: Chief compliance officer. Every SEC RIA must name one; at small firms the CCO usually holds another job too.
  - key: marketing_rule
    title: Marketing Rule
    body: SEC rule 206(4)-1 on adviser advertising, testimonials, endorsements and performance. Item 5.L reports what a firm's ads include.
  - key: x1031
    title: 1031 exchange
    body: Selling investment property and buying like-kind property to defer capital gains tax. The replacement must be identified within 45 days and closed within 180.
  - key: dst
    title: DST
    body: Delaware statutory trust. A fractional real estate interest that qualifies as like-kind for a 1031 exchange; how many advisers complete exchanges for clients.
  - key: net_lease
    title: Net lease
    body: A lease where the tenant pays taxes, insurance and maintenance, so the owner receives steady rent. PHH's focus, with industrial and necessity retail.
  - key: covered_call
    title: Covered call
    body: Selling call options on shares already owned to earn premium. One contract covers 100 shares. AcuBooth runs it as an overlay.
  - key: k1
    title: K-1
    body: The partnership tax form private fund investors receive. Whether a firm's custodian and reporting handle K-1s decides whether it can use private funds.
  - key: microsoft365
    title: Microsoft 365
    body: Microsoft's email (Exchange Online), Teams and SharePoint suite. Glynac connects to it, and to Dynamics-based CRMs. Bellwether reads it from the firm's public mail records.
  - key: salesforce
    title: Salesforce
    body: CRM platform. RIA CRMs built on it (Practifi, XLR8, Salentica) count as Salesforce for Glynac.
  - key: redtail
    title: Redtail
    body: The most common CRM at small and mid-sized RIAs (Orion owns it). Glynac integrates with it.
  - key: black_diamond
    title: Black Diamond
    body: SS&C's portfolio reporting platform for RIAs. Glynac integrates with it. Orion, Tamarac, Addepar and Advyzon are competing platforms.

# --------------------------------------------------- Acumen and its products
products:
  - key: acumen
    title: Acumen Strategy
    body: Acumen Strategy uses Bellwether to find and approach the US investment advisers most likely to buy its three product families, PHH, AcuBooth and Glynac. Buyers are almost always independent wealth managers; custodians, wirehouses, broker-dealers, banks, insurers and asset managers are not.
  - key: phh
    title: PHH (Prairie Hill)
    body: Private net-lease real estate sold through advisers. PHH Fund I is an evergreen fund for advisers' HNW clients (independent RIAs with $250M to $5B, individuals half or more of assets). PHH 1031 completes clients' property exchanges (RIAs whose clients own businesses or investment property; CPAs, attorneys and intermediaries refer too). PHH JV partners with family offices and institutions writing $5M+ checks.
  - key: acubooth
    title: AcuBooth
    body: A covered call overlay on concentrated equity positions, for advisers with HNW books custodied at Schwab, $100M+ in assets and no private funds. Each position needs at least 100 shares.
  - key: glynac
    title: Glynac
    body: Continuous cross-system compliance, portfolio and vendor intelligence for independent RIAs (SEC-registered, $100M+, not owned by a bank, insurer or wirehouse). Works with Microsoft 365 (mail, Teams, Dynamics CRMs), Salesforce (including Practifi and XLR8), Redtail and Black Diamond. Competes with Hadrius and COMPLY.

# ------------------------------------------------- how Bellwether works
facts:
  - key: scores
    title: How scores work
    body: Each product list ranks firms by a score out of 100. Gates decide who is on a list, disqualifiers remove firms, factors earn points by weight. Unknown data earns zero and lowers coverage (the share of the score resting on known data); it never disqualifies.
  - key: firm_types
    title: Firm types
    body: Every firm is classified from its Form ADV answers, its owners and the known-entity list into one type, with a confidence and the reasons. Each product sells only to some types; admins correct a type in Settings, Firm types, and corrections survive reclassification.
  - key: sources
    title: Where the data comes from
    body: SEC weekly adviser and individual feeds (Form ADV, IAPD), the SEC Form ADV archive (Schedules A, B and D to 2024), Part 2A brochures, 13F filings, firm websites and public mail records. Nothing paid.
  - key: manual_levels
    title: Manual levels and status
    body: Some factors (warm introduction, manager search) can be set by hand on a firm page; the hand-set level replaces the computed one and says who set it. Status and owner track the sales process.
  - key: signals
    title: Signals
    body: Changes worth a call (new registration, assets jump, advisors added, custodian change, first private fund), detected by comparing weekly filings.
