# Industry knowledge: what Bellwether knows about the adviser industry and
# about Acumen's own purpose, beyond what any one filing says.
#
# This file seeds the knowledge base (table knowledge_item) the first time
# Bellwether starts, and again whenever an item here changes, but it never
# overwrites an item an admin has edited in Settings, Industry knowledge. From
# then on the database copy is the one in force; this file stays the shipped
# default and the reset point.
#
# Four readers use it:
#   - the firm-type classifier (prospect/firmtype.py) reads the categories and
#     the known entities: a firm whose name, or whose controlling owner's name,
#     matches a known entity's pattern is placed in that entity's category;
#   - the product scores read each firm's category (config/products.yml says
#     which categories each product sells to);
#   - Bellwether AI reads a compact digest of all of it (prospect/knowledge.py)
#     before answering, so it knows a custodian from a wealth manager and what
#     Acumen sells to whom;
#   - admins read and edit it in Settings.
#
# Patterns: plain words match whole words in the name, ignoring case and
# punctuation ("Charles Schwab" matches "THE CHARLES SCHWAB CORPORATION" but
# "Pershing LLC" does not match "Pershing Square Capital"). A pattern that
# starts with "re:" is a regular expression over the name in capitals with
# punctuation turned into spaces. When several entities match one name, the
# longest pattern wins, so "Morgan Stanley Investment Management" (an asset
# manager) beats "Morgan Stanley". `patterns` are matched against the firm's
# own legal and business names; `parents` against the names of companies that
# own 50% or more of it (Schedule A).

version: 1

# ------------------------------------------------------------- firm types
# The keys are fixed (the classifier's rules produce them); labels, the
# description and how Bellwether treats each type can be edited in Settings.
categories:
  - key: independent_ria
    label: Independent RIA
    short: Independent RIA
    description: A registered adviser that manages money and plans for individuals and families, owned by its people or an RIA group rather than by a bank, insurer, broker-dealer or custodian.
    treatment: The core market. Eligible for every product list.
  - key: hybrid_ria
    label: Hybrid RIA
    short: Hybrid RIA
    description: A wealth manager for individuals whose advisors are also registered reps of a broker-dealer, or that has an affiliated broker-dealer. Independent, with part of its business on commission.
    treatment: Core market, eligible for every product list. Brokerage oversight adds compliance work Glynac can take on.
  - key: multi_family_office
    label: Multi-family office
    short: Family office
    description: Serves a small number of very wealthy families (HNW clients averaging $20M or more, or calls itself a family office), usually with investment, tax, trust and estate work under one roof.
    treatment: Core market for PHH JV and Glynac, eligible for every list. Single-family offices do not file with the SEC.
  - key: consultant_ocio
    label: Institutional consultant or OCIO
    short: Consultant / OCIO
    description: Advises pension plans, endowments, foundations and other institutions on asset allocation and manager selection, or runs their portfolio as an outsourced chief investment officer.
    treatment: Not a Glynac or AcuBooth buyer. A possible PHH JV allocator.
  - key: tamp
    label: TAMP or model provider
    short: TAMP / platform
    description: A turnkey asset management platform, model portfolio provider, sub-adviser or RIA platform that runs money other advisers bring, often through wrap programs with thousands of accounts per employee.
    treatment: A distribution partner, not a buyer. Excluded from every list.
  - key: robo
    label: Digital adviser
    short: Robo-adviser
    description: An internet-based adviser serving very many small accounts through an app or website (a robo-adviser).
    treatment: Excluded from every list.
  - key: asset_manager
    label: Asset manager
    short: Asset manager
    description: Manages mutual funds, ETFs or institutional separate accounts. Its clients are funds and institutions, not families.
    treatment: Excluded from every list. Never a Glynac buyer.
  - key: private_fund
    label: Private fund manager
    short: Private funds
    description: A hedge fund, private equity, venture, private credit or real estate fund manager. Most of its assets sit in pooled vehicles it sponsors.
    treatment: Excluded from every list. Real estate fund managers are PHH competitors.
  - key: custodian
    label: Custodian or clearing firm
    short: Custodian
    description: Holds client assets or clears trades for advisers (Schwab, Fidelity, BNY Pershing, Apex, Interactive Brokers and the like), including the advisory arms of those groups.
    treatment: Infrastructure, not a buyer. Excluded from every list; AcuBooth reads which custodian each firm uses.
  - key: wirehouse
    label: Wirehouse or national broker-dealer
    short: Wirehouse
    description: A national full-service brokerage with employee advisors (Morgan Stanley, Merrill, UBS, Wells Fargo, J.P. Morgan, Goldman Sachs, Edward Jones, Raymond James, Ameriprise, RBC and similar), and the advisers they control.
    treatment: Excluded. Their advisors buy through the home office, not on their own.
  - key: independent_bd
    label: Independent broker-dealer
    short: Broker-dealer
    description: A broker-dealer that is also a registered adviser, whose reps are mostly independent contractors (LPL, Commonwealth, Osaic, Cetera, Cambridge), or a regional or boutique broker-dealer.
    treatment: Excluded from the lists. A platform sale through the home office.
  - key: bank_trust
    label: Bank or trust company
    short: Bank / trust
    description: A bank or trust company, or an adviser controlled by one.
    treatment: Excluded, except PHH JV, where trust companies serving wealthy families can be partners.
  - key: insurance
    label: Insurance-affiliated adviser
    short: Insurer-owned
    description: An adviser owned by or built around an insurance company (Northwestern Mutual, MassMutual, New York Life and the like).
    treatment: Excluded from every list.
  - key: era
    label: Exempt reporting adviser
    short: Exempt (ERA)
    description: Files a short Form ADV but is not registered. Advises only venture funds, or private funds under $150M in the US.
    treatment: Excluded from every list; it is not a registered adviser.
  - key: unknown
    label: Not classified
    short: Unclassified
    description: Not enough on file yet to tell what kind of firm it is.
    treatment: Never excluded. Missing data never disqualifies a firm.

