      - "tax managed"
      - "tax-managed"
      - "tax efficient investing"

# Terms that, in the same sentence as a hit, make it negation-ambiguous. Those
# sentences route to the review queue; the tag stays present at damped
# confidence until a human keeps or rejects the negation.
negation_terms:
  - "do not"
  - "does not"
  - "will not"
  - "not use"
  - "not utilize"
  - "not employ"
  - "no longer"
  - "never"
  - "prohibit"
  - "prohibited"
  - "without the use"
  - "avoid"
  - "avoids"
  - "not typically"
  - "rarely"
  - "except"

section_bonus_items: [4, 8]
snippet_max_words: 25
max_pages: 80
