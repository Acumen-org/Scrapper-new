# Deterministic brochure tag vocabulary. No model calls anywhere in the pipeline.
#
# Confidence is assembled from parts, stored separately so the UI can show why a
# tag scored what it did (same rule as the firm scores):
#   specificity  from the longest phrase matched: 3+ words 0.9, 2 words 0.7,
#                single word or acronym 0.5 (word-boundary matched)
#   hits         plus 0.02 per hit, capped at 5 hits
#   section      plus 0.05 when the hit sits in Item 4 (Advisory Business) or
#                Item 8 (Methods of Analysis) of Part 2A
#   negation     multiplied by 0.6 while a negation-ambiguous hit is unreviewed.
#                An unreviewed row NEVER makes a tag absent, only less confident.
#
# The verbatim supporting sentence is stored with every tag, capped at 25 words:
# an SDR opening with the firm's own brochure language is the whole point.

# v2 (2026-09) added the vocabulary the product scores read: private markets,
# how investment decisions are made, real assets, 1031 and owner clients,
# reporting platforms and compliance vendors. Brochures tagged under v1 are
# re-tagged from their cached text by `python -m scripts.brochures --retag`.
config_version: 2

# Which product a tag is a talking point for. Tags marked `signal` feed a score
# (a platform, a process) but are not sales language.
