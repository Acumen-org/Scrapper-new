name: Deployment diagnostics
on:
  workflow_dispatch:
    inputs:
      ai_check:
        description: Also plan one question and stream one answer with the connected AI model
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: bellwether-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-nomad@main
        with:
          version: latest
      - name: Inspect Bellwether allocation health
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
          AI_CHECK: ${{ inputs.ai_check }}
        run: python3 scripts/deployment_diagnostics.py
