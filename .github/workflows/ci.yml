# ---------------------------------------------------------------------------
# CI for Bellwether (Acumen-org/Scrapper-new).
#
#   test    — self-hosted, like the rest. The send to Cadence against the fake
#             Cadence and the contract fixture (qa_cadence), the offline
#             regressions (qa_requirements), the style rule (qa_style), and the
#             Postgres adapter on a real, throwaway Postgres (qa_pg). Nothing
#             is built or deployed unless they pass.
#   build   — self-hosted: Harbor is not routable from GitHub's runners.
#             Builds and pushes bellwether/app:YYYY-MM-DD-<sha7>.
#   deploy  — self-hosted. Hands that exact tag to Nomad, which pulls it from
#             Harbor. `nomad job run` waits on the deployment and exits
#             non-zero if it fails; the jobspec's auto_revert rolls it back.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Never cancel a deploy midway; queue the next push behind it instead.
concurrency:
  group: deploy-bellwether
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: h4rb0r.pmx.acumen-strategy.com
  DOCKER_IMAGE: h4rb0r.pmx.acumen-strategy.com/bellwether/app

jobs:
  # --------------------------------------------------------------------- test
  test:
    name: tests
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bellwether
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: bellwether_ci
          POSTGRES_INITDB_ARGS: --encoding=UTF8
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U bellwether" --health-interval 5s
          --health-timeout 5s --health-retries 12

    env:
      BELLWETHER_DSN: postgresql://bellwether:ci-only@127.0.0.1:55432/bellwether_ci
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Style
        run: python -m scripts.qa_style

      - name: Send to Cadence, against the fake Cadence, and the contract fixture
        run: python -m scripts.qa_cadence

      - name: Offline regressions
        run: python -m scripts.qa_requirements

      - name: Postgres adapter, on a real Postgres
        run: python -m scripts.qa_pg

  # -------------------------------------------------------------------- build
  build:
    name: build + push image
    runs-on: self-hosted
    needs: test

    outputs:
      IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same shape as the hand-made tags (2026-09-02-nulfix), with the commit
      # in place of the label.
      - name: Generate image tag
        id: tag
        run: echo "IMAGE_TAG=$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }}

  # ------------------------------------------------------------------- deploy
  deploy:
    name: deploy to Nomad
    runs-on: self-hosted
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-nomad@main
        with:
          version: latest

      # NOMAD_VAR_* instead of -var so the password never lands on a command line.
      - name: nomad job run
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
          NOMAD_VAR_image_tag: ${{ needs.build.outputs.IMAGE_TAG }}
          NOMAD_VAR_harbor_username: ${{ secrets.HARBOR_USERNAME }}
          NOMAD_VAR_harbor_password: ${{ secrets.HARBOR_PASSWORD }}
          NOMAD_VAR_reacher_secret: ${{ secrets.BELLWETHER_REACHER_SECRET }}
        run: |
          nomad job validate nomad/bellwether.nomad.hcl
          nomad job run nomad/bellwether.nomad.hcl

      - name: Configure Microsoft sign-in
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
          BELLWETHER_MS_CONFIG: ${{ secrets.BELLWETHER_MS_CONFIG }}
        shell: bash
        run: |
          if [ -n "$BELLWETHER_MS_CONFIG" ]; then
            allocation=$(nomad job allocs -json bellwether | jq -r '[.[] | select(.ClientStatus == "running")] | sort_by(.CreateIndex) | last | .ID')
            test -n "$allocation" && test "$allocation" != "null"
            printf '%s' "$BELLWETHER_MS_CONFIG" | nomad alloc exec -i -t=false -task app "$allocation" python -m scripts.configure_microsoft
          fi

      - name: Apply workspace release and validate data
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        shell: bash
        run: |
          allocation=$(nomad job allocs -json bellwether | jq -r '[.[] | select(.ClientStatus == "running")] | sort_by(.CreateIndex) | last | .ID')
          test -n "$allocation" && test "$allocation" != "null"
          nomad alloc exec -t=false -task app "$allocation" python -m scripts.release_workspace
