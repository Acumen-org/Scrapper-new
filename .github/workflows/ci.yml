# Push to main, get a tested image. That is the whole point of this file.
#
# Three jobs, in order, each gating the next:
#
#   gate    runs the Postgres adapter checks against a real throwaway database
#           on every push and every pull request. Nothing merges or ships
#           without this passing.
#   image   builds the container and publishes it to GHCR, tagged with the
#           commit sha and with "latest". Only on main, only after the gate.
#   release advances the `release` branch to the tested commit. A timer on the
#           server watches that branch and deploys it, so nothing about the
#           server is exposed to GitHub and no secrets are stored here.
#   image   publishes to GHCR as a rollback artifact. Not the deploy path.
#
# The gate deliberately runs scripts.qa_pg, not scripts.qa_smoke: qa_smoke needs
# a populated database (it opens the top firm on a product list), which CI does
# not have. qa_smoke stays the pre-merge check you run against a real instance.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you deploy the current main by hand

concurrency:
  # One pipeline per branch. A second push supersedes the first rather than
  # racing it to the registry.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_DB: bellwether_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Postgres adapter checks
        env:
          BELLWETHER_DSN: postgresql://ci:ci@localhost:5432/bellwether_ci
          BELLWETHER_DATA: ${{ runner.temp }}/data
        run: |
          mkdir -p "$BELLWETHER_DATA"
          python -m scripts.qa_pg
      - name: Every script parses and the app imports
        env:
          BELLWETHER_DSN: postgresql://ci:ci@localhost:5432/bellwether_ci
          BELLWETHER_DATA: ${{ runner.temp }}/data
        run: |
          python -m compileall -q prospect scripts
          python -c "from prospect import webapp; print('app imports,', len(webapp.app.routes), 'routes')"
      - name: No em dashes in shipped source
        run: python -m scripts.qa_style

  release:
    # Fast-forwards the `release` branch to this tested commit. The server's
    # timer watches that branch, so this is the gate between "tests passed" and
    # "the website may run it". Nothing else advances the branch.
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # GITHUB_TOKEN can move the branch; no PAT needed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance release to this commit
        run: |
          git push origin "${GITHUB_SHA}:refs/heads/release"
          echo "release now points at ${GITHUB_SHA::12}"
          echo "the server deploys it within a few minutes"

  image:
    # A rollback artifact in the registry, not the deploy path: the server builds
    # locally because the image is private and the jobspec holds no credentials.
    # continue-on-error so a registry problem never blocks a release.
    needs: gate
    continue-on-error: true
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GITHUB_TOKEN can push to GHCR with this; no PAT needed
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the tag
        id: meta
        run: |
          # Lowercase: GHCR rejects uppercase repository names.
          repo=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/$repo" >> "$GITHUB_OUTPUT"
          echo "tag=${{ env.REGISTRY }}/$repo:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Say what shipped
        run: echo "pushed ${{ steps.meta.outputs.tag }}"
