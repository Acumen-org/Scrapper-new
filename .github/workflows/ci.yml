# ---------------------------------------------------------------------------
# CI for Bellwether (Acumen-org/Scrapper-new).
#
#   build   — self-hosted: Harbor is not routable from GitHub's runners.
#             Runs on push to main only.
#   deploy  — self-hosted. Deploys the newest date-tagged image in Harbor
#             (YYYY-MM-DD-<label>), whoever pushed it: after a build that is the
#             image just built; from "Run workflow" it redeploys without building.
#             `nomad job run` waits on the deployment and exits non-zero if it
#             fails; the jobspec's auto_revert rolls it back.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Never cancel a deploy midway; queue the next push behind it instead.
concurrency:
  group: deploy-bellwether
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: h4rb0r.pmx.acumen-strategy.com
  DOCKER_IMAGE: h4rb0r.pmx.acumen-strategy.com/bellwether/app

jobs:
  # -------------------------------------------------------------------- build
  build:
    name: build + push image
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same shape as the hand-made tags (2026-09-02-nulfix), with the commit
      # in place of the label.
      - name: Generate image tag
        id: tag
        run: echo "IMAGE=${DOCKER_IMAGE}:$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.IMAGE }}

  # ------------------------------------------------------------------- deploy
  deploy:
    name: deploy to Nomad
    runs-on: self-hosted
    needs: build
    # Run after a successful build, or on its own when build was skipped.
    if: ${{ !failure() && !cancelled() }}

    steps:
      - uses: actions/checkout@v4

      # Newest tag by push time among YYYY-MM-DD-* tags; anything else
      # (latest, buildcache, untagged) is ignored.
      - name: Resolve newest image in Harbor
        id: latest
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          TAG=$(curl -fsS -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            "https://${REGISTRY}/api/v2.0/projects/bellwether/repositories/app/artifacts?with_tag=true&sort=-push_time&page_size=100" \
            | jq -r '[.[].tags[]? | select(.name | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}-"))]
                     | sort_by(.push_time) | last | .name // empty')
          if [ -z "$TAG" ]; then
            echo "::error::No YYYY-MM-DD-* tag found in bellwether/app"
            exit 1
          fi
          echo "Deploying ${DOCKER_IMAGE}:${TAG}"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-nomad@main
        with:
          version: latest

      # NOMAD_VAR_* instead of -var so the password never lands on a command line.
      - name: nomad job run
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
          NOMAD_VAR_image_tag: ${{ steps.latest.outputs.TAG }}
          NOMAD_VAR_harbor_username: ${{ secrets.HARBOR_USERNAME }}
          NOMAD_VAR_harbor_password: ${{ secrets.HARBOR_PASSWORD }}
        run: nomad job run bellwether.nomad.hcl
